# Builds the static site and publishes it to GitHub Pages.
#
# One-time setup: Settings › Pages › Source: "GitHub Actions".
# Optional repository variables (Settings › Secrets and variables › Actions › Variables) override the
# build's VITE_* values (see .env.example): VITE_SITE_URL, VITE_BASE, VITE_GUILD_ID, VITE_GUILD_API,
# VITE_GRASS_URL, VITE_MATRIX_URL, VITE_LCD_URL. Left unset, VITE_BASE and VITE_SITE_URL follow the
# Pages site (a custom domain serves from /, otherwise /structs-kor/).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version from package.json › packageManager

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - id: pages
        uses: actions/configure-pages@v5

      - run: pnpm test

      - run: pnpm build
        env:
          VITE_BASE: ${{ vars.VITE_BASE || format('{0}/', steps.pages.outputs.base_path) }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL || steps.pages.outputs.origin }}
          VITE_GUILD_ID: ${{ vars.VITE_GUILD_ID }}
          VITE_GUILD_API: ${{ vars.VITE_GUILD_API }}
          VITE_GRASS_URL: ${{ vars.VITE_GRASS_URL }}
          VITE_MATRIX_URL: ${{ vars.VITE_MATRIX_URL }}
          VITE_LCD_URL: ${{ vars.VITE_LCD_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
